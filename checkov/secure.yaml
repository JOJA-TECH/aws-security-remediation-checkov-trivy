  # Compensating control: ALB is the only ingress; app-only HTTP demo data.
  # Approver: arquitectura-uc | Review: 2026-06-30
  # Terraform comment: see terraform/secure/alb.tf (EXCEPTION block).
  - CKV_AWS_2
  # Control: CKV_AWS_103 (ALB listener TLS >= 1.2) - no HTTPS listener exists.
  - CKV_AWS_103
  # Control: CKV_AWS_378 (target group must not use HTTP).
  - CKV_AWS_378
  # Control: CKV2_AWS_20 (ALB must redirect HTTP -> HTTPS).
  - CKV2_AWS_20

  # --- WAF not deployed (cost) ----------------------------------------------
