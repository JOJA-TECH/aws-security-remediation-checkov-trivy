# Checkov configuration for the "secure" stack.
#
# Policy: terraform/secure MUST produce zero failed checks. Any finding that
# cannot be addressed in this academic, low-cost scope is listed below as a
# SPECIFIC, justified skip (never a global soft-fail). Each skip documents the
# control, the technical reason, the risk, the compensating control, the
# approver and the review date. See docs/correcciones.md for the full record.
#
# The insecure stack (terraform/insecure) is scanned WITHOUT this file so its
# findings remain fully visible for the evidence report.

skip-check:
