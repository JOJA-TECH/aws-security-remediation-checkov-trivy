services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: insecure-infra-demo:local
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: local
      GIT_COMMIT: local
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
